[pytest]
# Reporte HTML autocontenido + screenshots en fallo (ver conftest.py).
addopts = -ra -v --html=reports/report.html --self-contained-html
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    publico: pruebas públicas no destructivas (no requieren credenciales)
    credenciales: requieren QA_ADMIN_EMAIL / QA_ADMIN_PASSWORD (se saltan si faltan)
    crud: crean/editan/borran datos de prueba con prefijo QA-TEST- y limpian siempre
    mapa: dependen de activar teselas externas (MapLibre/OpenStreetMap)
    a11y: chequeos básicos de accesibilidad (landmarks/títulos)
filterwarnings =
    ignore::DeprecationWarning
